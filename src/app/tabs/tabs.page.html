<ion-tabs>
  <!-- La barra de pestañas va abajo -->
  <ion-tab-bar slot="bottom">
    <!-- tab="recetas" debe coincidir con el path de la ruta -->
    <ion-tab-button tab="recetas">
      <ion-icon name="restaurant"></ion-icon>
      <ion-label>Recetas</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="categorias">
      <ion-icon name="grid"></ion-icon>
      <ion-label>Categorías</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="favoritos">
      <ion-icon name="heart"></ion-icon>
      <ion-label>Favoritos</ion-label>
      <!-- ion-badge: aparece solo si hay al menos 1 favorito -->
      <ion-badge color="danger" *ngIf="(totalFavoritos$ | async) as total">{{ total }}</ion-badge>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
