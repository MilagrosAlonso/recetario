<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Categorías</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- INDICADOR DE CARGA -->
  <div class="estado" *ngIf="cargando">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Cargando categorías...</p>
  </div>

  <!-- MENSAJE DE ERROR -->
  <div class="estado error" *ngIf="error && !cargando">
    <ion-icon name="alert-circle-outline" size="large"></ion-icon>
    <p>No se pudieron cargar las categorías. Revisa tu conexión.</p>
    <ion-button size="small" (click)="cargarCategorias()">Reintentar</ion-button>
  </div>

  <!-- ion-accordion-group: cada categoría es un acordeón desplegable -->
  <ion-accordion-group *ngIf="!cargando && !error" (ionChange)="alAbrirAcordeon($event)">
    <ion-accordion *ngFor="let cat of categorias" [value]="cat.strCategory">
      <!-- Parte siempre visible -->
      <ion-item slot="header">
        <ion-thumbnail slot="start">
          <img [src]="cat.strCategoryThumb" [alt]="cat.strCategory" loading="lazy" />
        </ion-thumbnail>
        <ion-label>{{ cat.strCategory | diccionario: 'categoria' }}</ion-label>
      </ion-item>

      <!-- Parte que se muestra al desplegar -->
      <div slot="content" class="contenido">
        <p class="descripcion">{{ descripcionesEs[cat.strCategory] || cat.strCategoryDescription }}</p>

        <div class="estado" *ngIf="cargandoCategoria === cat.strCategory">
          <ion-spinner name="dots"></ion-spinner>
        </div>

        <div class="estado error" *ngIf="errorCategoria === cat.strCategory">
          <p>No se pudieron cargar las recetas.</p>
          <ion-button size="small" (click)="cargarRecetas(cat.strCategory)">Reintentar</ion-button>
        </div>

        <ion-list *ngIf="recetasPorCategoria[cat.strCategory]">
          <ion-item
            *ngFor="let receta of recetasPorCategoria[cat.strCategory]"
            button
            detail
            (click)="abrir(receta.idMeal)"
          >
            <ion-thumbnail slot="start">
              <img [src]="receta.strMealThumb" [alt]="receta.strMeal" loading="lazy" />
            </ion-thumbnail>
            <ion-label>{{ receta.strMeal }}</ion-label>
          </ion-item>
        </ion-list>
      </div>
    </ion-accordion>
  </ion-accordion-group>
</ion-content>

<app-receta-modal [idMeal]="recetaSeleccionada" (cerrar)="recetaSeleccionada = null"></app-receta-modal>
